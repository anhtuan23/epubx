name: epubx
description: Epub Parser for Dart. Epub package fork. Suitable for use on the Server, the Web, or in Flutter
homepage: https://github.com/anhtuan23/epubx
issue_tracker: https://github.com/anhtuan23/epubx/issues
version: 4.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  archive: ^4.0.9
  quiver: ^3.2.1
  xml: ^6.6.1
  # Keep image below 4.9.0 because image 4.9.x requires xml 7 and a newer meta
  # than the active Flutter SDK pins through flutter_test.
  image: ">=4.3.0 <4.9.0"
  collection: ^1.19.1
  path: ^1.9.1
  equatable: ^2.0.8

dev_dependencies:
  test: ^1.31.1
  lints: ^6.1.0
